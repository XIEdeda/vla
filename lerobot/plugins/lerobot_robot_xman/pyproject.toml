[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_xman"
version = "0.1.0"
description = "Template LeRobot plugin for a custom humanoid robot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lerobot",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["lerobot_robot_xman*"]
